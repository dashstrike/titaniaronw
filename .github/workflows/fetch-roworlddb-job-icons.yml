name: Fetch RoworldDB job icons

on:
  push:
    paths:
      - '.github/workflows/fetch-roworlddb-job-icons.yml'

permissions:
  contents: write

jobs:
  fetch-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all job icons used by the RoworldDB SEA skill planner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/job /tmp/roworlddb-jobs

          SOURCE_BASE='https://raw.githubusercontent.com/Third07/ragnarok-new-world-hub/main/public/sea/skill-simulator/data'
          curl --fail --location --silent --show-error --retry 2 "$SOURCE_BASE/skills_index_en-US.json" -o /tmp/roworlddb-jobs/jobs.json
          curl --fail --location --silent --show-error --retry 2 "$SOURCE_BASE/icon_paths.json" -o /tmp/roworlddb-jobs/icon_paths.json

          python3 - <<'PY' > /tmp/roworlddb-jobs/jobs.tsv
          import json, re

          with open('/tmp/roworlddb-jobs/jobs.json', encoding='utf-8') as f:
              jobs = json.load(f).get('jobs', {})
          with open('/tmp/roworlddb-jobs/icon_paths.json', encoding='utf-8') as f:
              icon_paths = json.load(f)

          for job_id, job in jobs.items():
              name = str(job.get('job_name') or '').strip()
              icon = str(job.get('job_icon') or '').strip()
              if not name or name == 'Not yet available' or not icon:
                  continue
              path = icon_paths.get(icon)
              if not path:
                  continue
              slug = re.sub(r'[^a-z0-9]+', '-', name.lower()).strip('-')
              print(f'{job_id}\t{name}\t{slug}\t{path}')
          PY

          : > assets/images/job/job-icons.json.tmp
          printf '{\n' >> assets/images/job/job-icons.json.tmp
          first=1

          while IFS=$'\t' read -r job_id job_name slug icon_path; do
            [ -n "$slug" ] || continue
            ext="${icon_path##*.}"
            out="assets/images/job/${slug}.${ext}"
            url="https://www.roworlddb.com/media/images/${icon_path}"

            echo "Fetching ${job_name}: ${url}"
            curl --fail --location --silent --show-error --retry 2 \
              --user-agent 'Mozilla/5.0 Titania-Guild-Management' \
              "$url" -o "$out"

            test -s "$out"
            file "$out" | grep -qiE 'Web/P image|PNG image data|JPEG image data'

            if [ "$first" -eq 0 ]; then printf ',\n' >> assets/images/job/job-icons.json.tmp; fi
            first=0
            printf '  "%s": "%s"' "$job_name" "${slug}.${ext}" >> assets/images/job/job-icons.json.tmp
          done < /tmp/roworlddb-jobs/jobs.tsv

          printf '\n}\n' >> assets/images/job/job-icons.json.tmp
          mv assets/images/job/job-icons.json.tmp assets/images/job/job-icons.json

      - name: Commit downloaded icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/job
          if git diff --cached --quiet; then
            echo 'No icon changes to commit.'
            exit 0
          fi
          git commit -m 'Add RoworldDB job icons'
          git push
