name: Fetch RoworldDB job icons

on:
  push:
    paths:
      - '.github/workflows/fetch-roworlddb-job-icons.yml'

permissions:
  contents: write

jobs:
  fetch-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download job icons from RoworldDB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/job

          download_icon() {
            local slug="$1"
            local icon="$2"
            local out="assets/images/job/${slug}.png"
            local root_url="https://www.roworlddb.com/media/images/job/${icon}.png"
            local sea_url="https://www.roworlddb.com/sea/media/images/job/${icon}.png"

            echo "Fetching ${slug} (${icon})"
            if ! curl --fail --location --silent --show-error --retry 2 \
              --user-agent 'Mozilla/5.0 Titania-Guild-Management' \
              "$root_url" -o "$out"; then
              curl --fail --location --silent --show-error --retry 2 \
                --user-agent 'Mozilla/5.0 Titania-Guild-Management' \
                "$sea_url" -o "$out"
            fi

            test -s "$out"
            file "$out" | grep -qiE 'PNG image data|Web/P image|JPEG image data'
          }

          download_icon swordman icon_jsxq_1
          download_icon knight icon_jsxq_7
          download_icon lord-knight icon_jsxq_4008
          download_icon crusader icon_jsxq_14
          download_icon paladin icon_jsxq_4015
          download_icon mage icon_jsxq_2
          download_icon wizard icon_jsxq_11
          download_icon high-wizard icon_jsxq_4012
          download_icon archer icon_jsxq_3
          download_icon hunter icon_jsxq_10
          download_icon sniper icon_jsxq_4011
          download_icon bard icon_jsxq_19
          download_icon clown icon_jsxq_4020
          download_icon dancer icon_jsxq_20
          download_icon gypsy icon_jsxq_4021
          download_icon acolyte icon_jsxq_4
          download_icon priest icon_jsxq_9
          download_icon high-priest icon_jsxq_4010
          download_icon monk icon_jsxq_15
          download_icon champion icon_jsxq_4016
          download_icon thief icon_jsxq_6
          download_icon assassin icon_jsxq_8
          download_icon assassin-cross icon_jsxq_4009
          download_icon merchant icon_jsxq_5
          download_icon blacksmith icon_jsxq_12
          download_icon whitesmith icon_jsxq_4013
          download_icon alchemist icon_jsxq_18
          download_icon creator icon_jsxq_4019
          download_icon gunslinger icon_jsxq_24
          download_icon rebel icon_jsxq_4215
          download_icon night-watch icon_jsxq_4306
          download_icon druid icon_jsxq_201
          download_icon kanos icon_jsxq_203
          download_icon alithea icon_jsxq_202

      - name: Commit downloaded icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/job
          if git diff --cached --quiet; then
            echo 'No icon changes to commit.'
            exit 0
          fi
          git commit -m 'Add RoworldDB job icons'
          git push
