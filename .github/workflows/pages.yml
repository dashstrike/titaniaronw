name: Deploy Titania to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Export static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          TITANIA_AUCTION_WORKFLOW: ${{ vars.TITANIA_AUCTION_WORKFLOW || 'true' }}
          APP_ENV: production
          APP_DEBUG: 'false'
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: php artisan pages:export --url="$SITE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storage/app/pages
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            count=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" | jq -r '.total_count')
            if [ "$count" = "1" ]; then
              exit 0
            fi
            if [ "$count" != "0" ]; then
              echo "Expected one github-pages artifact, found $count" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Pages artifact did not become visible within 60 seconds" >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
