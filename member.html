<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Titania · Member Profile</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <style>
    :root{--bg:#0c0f1a;--panel:#141a2b;--panel2:#1b2237;--line:#2a3350;--lineSoft:#202944;--text:#e9ecf7;--muted:#8b93b0;--muted2:#5f6889;--violet:#8b7cf6;--teal:#3fd6c4;--amber:#f0b429;--green:#4fd67a;--red:#ef5a6f;--shadow:0 18px 45px rgba(0,0,0,.28)}
    html[data-theme="light"]{--bg:#eef1f7;--panel:#fff;--panel2:#f5f7fb;--line:#d8deeb;--lineSoft:#e6e9f2;--text:#171a29;--muted:#656e88;--muted2:#8b93a9;--violet:#6757d9;--teal:#168f83;--amber:#9a6800;--green:#168c45;--red:#c93f58;--shadow:0 16px 38px rgba(38,45,72,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:radial-gradient(900px 450px at 15% -10%,#221b4a44,transparent 60%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--lineSoft);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:40px;object-fit:contain}.brand b{display:block;letter-spacing:1.4px}.brand span{display:block;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--lineSoft);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700;font-size:13px}.btn:hover{border-color:var(--violet)}.wrap{width:min(1180px,calc(100% - 24px));margin:22px auto 50px}.loading,.error{margin:80px auto;max-width:650px;text-align:center;background:var(--panel);border:1px solid var(--lineSoft);border-radius:14px;padding:28px;color:var(--muted);box-shadow:var(--shadow)}.error b{display:block;color:var(--red);font-size:18px;margin-bottom:8px}.profile{display:none}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;background:var(--panel);border:1px solid var(--lineSoft);border-radius:16px;padding:22px;box-shadow:var(--shadow)}.identity{display:flex;align-items:center;gap:15px;min-width:0}.class-orb{width:48px;height:48px;border-radius:50%;box-shadow:0 0 22px currentColor;flex:none}.hero h1{margin:0 0 5px;font-size:30px}.subtitle{color:var(--muted);font-size:14px}.status{display:inline-flex;margin-top:9px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}.status.active{background:#4fd67a20;color:var(--green);border:1px solid #4fd67a55}.status.inactive{background:#ef5a6f20;color:var(--red);border:1px solid #ef5a6f55}.hero-gr{text-align:right}.hero-gr span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.hero-gr strong{display:block;font-size:34px;color:var(--amber);margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.metric,.panel{background:var(--panel);border:1px solid var(--lineSoft);border-radius:13px;padding:16px}.metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}.metric strong{display:block;font-size:23px;margin-top:6px}.gain.pos{color:var(--green)}.gain.neg{color:var(--red)}.gain.zero{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);gap:14px;margin-top:14px}.panel h2{font-size:15px;letter-spacing:.6px;text-transform:uppercase;margin:0 0 14px}.chart-wrap{height:310px;position:relative}.chart-empty{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--muted);font-size:14px}.chart-svg{width:100%;height:100%;overflow:visible}.chart-grid{stroke:var(--lineSoft);stroke-width:1}.chart-line{fill:none;stroke:var(--violet);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.chart-area{fill:color-mix(in srgb,var(--violet) 14%,transparent)}.chart-dot{fill:var(--panel);stroke:var(--violet);stroke-width:3}.chart-label{fill:var(--muted);font-size:11px}.info-list{display:grid;gap:0}.info-row{display:grid;grid-template-columns:115px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--lineSoft);font-size:13px}.info-row:last-child{border-bottom:0}.info-key{color:var(--muted)}.info-value{min-width:0;overflow-wrap:anywhere}.history{margin-top:14px}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--lineSoft);font-size:13px}.history-table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.delta-pos{color:var(--green);font-weight:700}.delta-neg{color:var(--red);font-weight:700}.delta-zero{color:var(--muted)}.muted{color:var(--muted)}@media(max-width:780px){.hero{flex-direction:column}.hero-gr{text-align:left}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{width:calc(100% - 14px);margin-top:10px}.topbar{padding:10px}.brand span{display:none}.history-table th:nth-child(3),.history-table td:nth-child(3){display:none}}@media(max-width:440px){.metrics{grid-template-columns:1fr}.hero h1{font-size:24px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="titania-logo.webp" alt="Titania"><div><b>TITANIA</b><span>Member Profile</span></div></div>
    <div class="actions"><a class="btn" href="./index.html">← Titania</a><button class="btn" id="themeBtn" type="button">☀ Light</button></div>
  </header>
  <main class="wrap">
    <div class="loading" id="loading">Loading member profile…</div>
    <div class="error" id="error" hidden><b>Could not load member</b><span id="errorText"></span></div>
    <div class="profile" id="profile">
      <section class="hero">
        <div class="identity"><span class="class-orb" id="classOrb"></span><div><h1 id="memberName"></h1><div class="subtitle" id="memberClass"></div><span class="status" id="memberStatus"></span></div></div>
        <div class="hero-gr"><span>Current Gear Rating</span><strong id="currentGr">0</strong></div>
      </section>
      <section class="metrics">
        <div class="metric"><span>7 Day Gain</span><strong id="gain7">—</strong></div>
        <div class="metric"><span>30 Day Gain</span><strong id="gain30">—</strong></div>
        <div class="metric"><span>Total Tracked Gain</span><strong id="gainTotal">—</strong></div>
        <div class="metric"><span>Tracking Since</span><strong id="trackingSince" style="font-size:17px">—</strong></div>
      </section>
      <section class="grid">
        <div class="panel"><h2>Gear Rating Progress</h2><div class="chart-wrap" id="chartWrap"></div></div>
        <div class="panel"><h2>Member Info</h2><div class="info-list" id="memberInfo"></div></div>
      </section>
      <section class="panel history"><h2>GR History</h2><div id="historyWrap"></div></section>
    </div>
  </main>
<script>
'use strict';

const CLASS_COLORS={Swordman:'#e2776b',Knight:'#e2776b','Lord Knight':'#e2776b',Crusader:'#e2776b',Paladin:'#e2776b',Mage:'#579ed3',Wizard:'#579ed3','High Wizard':'#579ed3',Archer:'#e2aa50',Hunter:'#e2aa50',Sniper:'#e2aa50',Bard:'#e2aa50',Clown:'#e2aa50',Dancer:'#e2aa50',Gypsy:'#e2aa50',Acolyte:'#78bd5b',Priest:'#78bd5b','High Priest':'#78bd5b',Monk:'#78bd5b',Champion:'#78bd5b',Thief:'#a579f2',Assassin:'#a579f2','Assassin Cross':'#a579f2',Merchant:'#df9056',Blacksmith:'#df9056',Whitesmith:'#df9056',Alchemist:'#df9056',Creator:'#df9056',Gunslinger:'#b27d69',Rebel:'#b27d69','Night Watch':'#b27d69',Druid:'#32947e',Kanos:'#32947e',Alithea:'#32947e',Unknown:'#8b93b0'};

let client=null;

function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function fmtGr(v){return Math.round(num(v)).toLocaleString();}
function fmtDate(v){const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
function fmtDateTime(v){const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function classColor(cls){return CLASS_COLORS[cls]||CLASS_COLORS.Unknown;}

function applyTheme(theme){document.documentElement.dataset.theme=theme;const btn=document.getElementById('themeBtn');if(btn)btn.textContent=theme==='light'?'☾ Dark':'☀ Light';try{localStorage.setItem('titania_member_theme',theme);}catch(_e){}}
function setupTheme(){let theme='';try{theme=localStorage.getItem('titania_member_theme')||localStorage.getItem('titania_public_theme')||'';}catch(_e){}if(!theme)theme=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';applyTheme(theme);document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));}

function gainAt(history,current,days){if(!history.length)return null;const cutoff=Date.now()-days*86400000;let base=null;for(const row of history){const t=new Date(row.recorded_at).getTime();if(t<=cutoff)base=row;else break;}if(!base)base=history[0];return current-num(base.gear_rating);}
function setGain(id,value){const el=document.getElementById(id);if(value==null){el.textContent='—';el.className='';return;}el.textContent=`${value>0?'+':''}${Math.round(value).toLocaleString()}`;el.className=`gain ${value>0?'pos':value<0?'neg':'zero'}`;}

function renderChart(history){const wrap=document.getElementById('chartWrap');if(history.length<2){wrap.innerHTML='<div class="chart-empty">Progress tracking is active. The chart will appear after this member\'s next GR change.</div>';return;}const width=900,height=280,pad={l:58,r:20,t:18,b:38};const values=history.map(r=>num(r.gear_rating));let min=Math.min(...values),max=Math.max(...values);if(min===max){min-=1;max+=1;}const range=max-min;min-=range*.08;max+=range*.08;const times=history.map(r=>new Date(r.recorded_at).getTime());let tMin=Math.min(...times),tMax=Math.max(...times);if(tMin===tMax)tMax=tMin+1;const x=t=>pad.l+((t-tMin)/(tMax-tMin))*(width-pad.l-pad.r);const y=v=>pad.t+(1-(v-min)/(max-min))*(height-pad.t-pad.b);const pts=history.map((r,i)=>`${x(times[i]).toFixed(1)},${y(values[i]).toFixed(1)}`).join(' ');let grid='';for(let i=0;i<4;i++){const value=min+(max-min)*(i/3);const yy=y(value);grid+=`<line class="chart-grid" x1="${pad.l}" y1="${yy}" x2="${width-pad.r}" y2="${yy}"></line><text class="chart-label" x="4" y="${yy+4}">${esc(fmtGr(value))}</text>`;}const area=`${x(times[0])},${height-pad.b} ${pts} ${x(times[times.length-1])},${height-pad.b}`;const dots=history.map((r,i)=>`<circle class="chart-dot" cx="${x(times[i])}" cy="${y(values[i])}" r="4"><title>${esc(fmtDateTime(r.recorded_at))} · ${esc(fmtGr(values[i]))}</title></circle>`).join('');const labels=`<text class="chart-label" x="${pad.l}" y="${height-8}">${esc(fmtDate(history[0].recorded_at))}</text><text class="chart-label" text-anchor="end" x="${width-pad.r}" y="${height-8}">${esc(fmtDate(history[history.length-1].recorded_at))}</text>`;wrap.innerHTML=`<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Gear rating progress chart">${grid}<polygon class="chart-area" points="${area}"></polygon><polyline class="chart-line" points="${pts}"></polyline>${dots}${labels}</svg>`;}

function renderHistory(history){const wrap=document.getElementById('historyWrap');if(!history.length){wrap.innerHTML='<div class="muted">No GR history recorded yet.</div>';return;}const desc=[...history].reverse();wrap.innerHTML=`<table class="history-table"><thead><tr><th>Date</th><th>Gear Rating</th><th>Change</th></tr></thead><tbody>${desc.map((row,index)=>{const chronologicalIndex=history.length-1-index;const prev=chronologicalIndex>0?history[chronologicalIndex-1]:null;const delta=prev?num(row.gear_rating)-num(prev.gear_rating):null;return `<tr><td>${esc(fmtDateTime(row.recorded_at))}</td><td><b>${esc(fmtGr(row.gear_rating))}</b></td><td class="${delta==null?'delta-zero':delta>0?'delta-pos':delta<0?'delta-neg':'delta-zero'}">${delta==null?'Baseline':`${delta>0?'+':''}${Math.round(delta).toLocaleString()}`}</td></tr>`;}).join('')}</tbody></table>`;}

function renderProfile(member,history){document.title=`Titania · ${member.name}`;document.getElementById('memberName').textContent=member.name||'Unknown';document.getElementById('memberClass').textContent=member.cls||'Unknown';const status=member.status==='inactive'?'inactive':'active';const statusEl=document.getElementById('memberStatus');statusEl.textContent=status;statusEl.className=`status ${status}`;document.getElementById('classOrb').style.background=classColor(member.cls);document.getElementById('classOrb').style.color=classColor(member.cls);const current=num(member.gr);document.getElementById('currentGr').textContent=fmtGr(current);setGain('gain7',gainAt(history,current,7));setGain('gain30',gainAt(history,current,30));setGain('gainTotal',history.length?current-num(history[0].gear_rating):null);document.getElementById('trackingSince').textContent=history.length?fmtDate(history[0].recorded_at):'—';document.getElementById('memberInfo').innerHTML=[['Member ID',member.id],['Class',member.cls||'Unknown'],['Status',status],['Last roster edit',member.updatedAt?fmtDateTime(member.updatedAt):'—'],['Updated by',member.updatedBy||'—'],['Inactive since',member.inactiveSince?fmtDate(member.inactiveSince):'—'],['Last returned',member.lastReturned?fmtDate(member.lastReturned):'—'],['Notes',member.notes||'—']].map(([k,v])=>`<div class="info-row"><div class="info-key">${esc(k)}</div><div class="info-value">${esc(v)}</div></div>`).join('');renderChart(history);renderHistory(history);document.getElementById('loading').hidden=true;document.getElementById('profile').style.display='block';}

function fail(message){document.getElementById('loading').hidden=true;document.getElementById('errorText').textContent=message;document.getElementById('error').hidden=false;}

async function boot(){setupTheme();const cfg=window.TITANIA_CONFIG||{};if(!cfg.supabaseUrl||!cfg.supabasePublishableKey){fail('Supabase configuration is missing.');return;}if(!window.supabase){fail('Supabase library did not load.');return;}const memberId=new URLSearchParams(location.search).get('id')||'';if(!memberId){fail('No member ID was provided.');return;}client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const userResult=await client.auth.getUser();if(userResult.error||!userResult.data||!userResult.data.user){fail('Sign in to Titania first, then open the member profile again.');return;}const profileResult=await client.from('profiles').select('approved,role').eq('id',userResult.data.user.id).single();if(profileResult.error||!profileResult.data||!profileResult.data.approved){fail('Your Titania account is not approved to view member profiles.');return;}const plannerResult=await client.from('planner_state').select('state').eq('id',1).single();if(plannerResult.error){fail(plannerResult.error.message||'Could not load planner data.');return;}const roster=Array.isArray(plannerResult.data&&plannerResult.data.state&&plannerResult.data.state.roster)?plannerResult.data.state.roster:[];const member=roster.find(m=>String(m&&m.id||'')===memberId);if(!member){fail('This member is no longer in the current roster.');return;}const historyResult=await client.from('gear_rating_history').select('gear_rating,recorded_at').eq('member_id',memberId).order('recorded_at',{ascending:true});if(historyResult.error){fail(historyResult.error.message||'Could not load GR history.');return;}renderProfile(member,historyResult.data||[]);}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
</script>
</body>
</html>
